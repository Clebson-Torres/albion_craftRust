<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albion Crafting Overlay</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Albion Crafting Overlay</p>
          <h1>Crafting lateral para bolsas e capas</h1>
          <div class="brand-meta">
            <span id="version-badge" class="meta-pill">v--</span>
            <span id="hotkey-badge" class="meta-pill">Ctrl+Shift+A</span>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="status" class="status">Carregando...</div>
          <button id="refresh-button" class="refresh-button" type="button">Atualizar</button>
        </div>
      </header>

      <section class="controls panel">
        <div class="controls-grid">
          <label>
            Servidor
            <select id="server-select"></select>
          </label>
          <label>
            Cidade atual
            <select id="city-select"></select>
          </label>
          <label>
            Premium
            <select id="premium-select"></select>
          </label>
          <label>
            Compra
            <select id="strategy-select"></select>
          </label>
          <label>
            Transporte/u
            <input id="transport-input" type="number" min="0" max="500" step="1" />
          </label>
          <label>
            Orcamento
            <input id="budget-input" type="number" min="0" step="1000" />
          </label>
        </div>
      </section>

      <main class="stack-layout">
        <section class="panel ranking-panel">
          <div class="panel-header compact">
            <div>
              <h2>Scanner</h2>
              <p id="meta-text"></p>
            </div>
            <span class="hint-pill">Top operacional</span>
          </div>
          <div id="ranking-list" class="ranking-list"></div>
        </section>

        <section class="panel detail-panel">
          <div id="detail-view" class="detail-view empty">
            Selecione uma oportunidade para ver os detalhes.
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
