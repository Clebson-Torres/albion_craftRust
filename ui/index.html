<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albion Crafting Overlay</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Albion Crafting Overlay</p>
          <h1>Crafting para bolsas e capas</h1>
        </div>
        <div id="status" class="status">Carregando...</div>
      </header>

      <section class="controls">
        <label>
          Servidor
          <select id="server-select"></select>
        </label>
        <label>
          Cidade atual
          <select id="city-select"></select>
        </label>
        <label>
          Compra
          <select id="strategy-select"></select>
        </label>
        <label>
          Transporte por unidade
          <input id="transport-input" type="number" min="0" max="500" step="1" />
        </label>
        <label>
          Premium
          <select id="premium-select"></select>
        </label>
        <label>
          Orcamento disponivel
          <input id="budget-input" type="number" min="0" step="1000" />
        </label>
        <button id="refresh-button" type="button">Atualizar</button>
      </section>

      <main class="layout">
        <section class="panel ranking-panel">
          <div class="panel-header">
            <h2>Top oportunidades</h2>
            <p id="meta-text"></p>
          </div>
          <div id="ranking-list" class="ranking-list"></div>
        </section>

        <section class="panel detail-panel">
          <div id="detail-view" class="detail-view empty">
            Selecione uma oportunidade para ver os detalhes.
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
